name: Yayınla (GitHub Pages)

# Varsayılan dala her push'ta siteyi GitHub Pages'e yükler.
# Bir kez yapılacak ayar: Settings → Pages → Source: "GitHub Actions".
# Özel alan adı (fawlibs.org) da Settings → Pages → Custom domain'den girilir.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Kontrol
        run: python3 scripts/kontrol.py
      - name: Yalnız site dosyalarını topla
        run: |
          mkdir _site
          cp -r *.html feed.xml sitemap.xml robots.txt og-image.png site.webmanifest assets data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
